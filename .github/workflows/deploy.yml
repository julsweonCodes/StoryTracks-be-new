name: Deploy Backend to EC2

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Show repo structure
        run: |
          echo "=== REPO STRUCTURE ==="
          ls -R .

      - name: Copy backend code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}

          source: "build.gradle,settings.gradle,gradlew,gradlew.bat,gradle/**,src/**,Dockerfile"
          target: "/home/ec2-user/app/storytrack-backend"
          rm: true

      - name: SSH into EC2 and deploy docker
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            cd /home/ec2-user/deploy
            docker-compose --env-file .env.prod -f docker-compose.prod.yml down
            docker system prune -f
            docker-compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache
            docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d
            echo "Deployment completed successfully"
