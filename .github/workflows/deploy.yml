name: Deploy Backend to EC2

on:
  push:
    branches:
      - prod

  # Manual trigger with optional dependency refresh
  workflow_dispatch:
    inputs:
      gradle_refresh:
        description: "Force refresh Gradle dependencies"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Copy backend code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}

          source: "build.gradle,settings.gradle,gradlew,gradlew.bat,gradle/**,src/**,Dockerfile"
          target: "/home/ec2-user/app/storytrack-backend"

          # Keep files for caching benefits (don't delete old files)
          rm: false

          timeout: 300s
          command_timeout: 20m

      - name: SSH into EC2 and deploy docker
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e

            GRADLE_REFRESH="${{ github.event.inputs.gradle_refresh || 'false' }}"
            echo "GRADLE_REFRESH=$GRADLE_REFRESH"

            cd /home/ec2-user/deploy

            docker-compose --env-file .env.prod -f docker-compose.prod.yml down

            GRADLE_REFRESH=$GRADLE_REFRESH docker-compose --env-file .env.prod -f docker-compose.prod.yml build

            docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d

            echo "Deployment completed successfully"
